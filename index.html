<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghibli Dünyası — Three.js</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe3f0; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #hud {
      position: fixed; left: 16px; bottom: 16px;
      font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: #2b3a42; background: rgba(255,255,255,.55);
      backdrop-filter: blur(6px); padding: 12px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.5; max-width: 260px;
      box-shadow: 0 6px 20px rgba(0,0,0,.12); user-select: none;
    }
    #hud b { color: #1b6e8c; }
    #hud kbd {
      background: #fff; border: 1px solid #cfd9dd; border-bottom-width: 2px;
      border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 600;
    }
    #loader {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: linear-gradient(#bfe3f0, #e9f7ef);
      font-family: ui-rounded, system-ui, sans-serif; color: #2b3a42;
      transition: opacity .6s ease; z-index: 10;
    }
    #loader .t { font-size: 18px; letter-spacing: .5px; opacity: .8; }
    #loader.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <b>Ghibli Dünyası</b><br />
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hareket ·
    <kbd>Shift</kbd> koş · <kbd>Space</kbd> zıpla<br />
    Fareyi sürükle: kamera · Tekerlek: yakınlaş
  </div>

  <div id="loader"><div class="t">Dünya yükleniyor…</div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
