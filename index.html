<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghibli Dünyası — Three.js</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe3f0; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Kağıt grain + suluboya hissi (ekran üstü katman) */
    #paper {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      mix-blend-mode: multiply; opacity: .45;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 200px 200px;
    }
    /* Yumuşak vinyet (resim çerçevesi hissi) */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 4;
      box-shadow: inset 0 0 220px rgba(60,47,42,.35);
    }

    #hud {
      position: fixed; left: 16px; bottom: 16px;
      font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: #2b3a42; background: rgba(255,255,255,.55);
      backdrop-filter: blur(6px); padding: 12px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.5; max-width: 260px;
      box-shadow: 0 6px 20px rgba(0,0,0,.12); user-select: none;
    }
    #hud b { color: #1b6e8c; }
    #status {
      position: fixed; left: 16px; top: 14px; z-index: 8;
      font-family: ui-monospace, monospace; font-size: 12px;
      color: #123; background: rgba(255,255,255,.7); padding: 6px 10px;
      border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }
    #status.ok { background: rgba(180,235,190,.85); }
    #status.err { background: rgba(245,190,180,.9); }
    #hud kbd {
      background: #fff; border: 1px solid #cfd9dd; border-bottom-width: 2px;
      border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 600;
    }
    #hud .mobile { display: none; }
    body.touch-device #hud .desktop { display: none; }
    body.touch-device #hud .mobile { display: inline; }
    #loader {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: linear-gradient(#bfe3f0, #e9f7ef);
      font-family: ui-rounded, system-ui, sans-serif; color: #2b3a42;
      transition: opacity .6s ease; z-index: 10;
    }
    #loader .t { font-size: 18px; letter-spacing: .5px; opacity: .8; }
    #loader.hide { opacity: 0; pointer-events: none; }

    /* --- Mobil dokunmatik kontroller --- */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
    #touch.on { display: block; }
    #joy {
      position: absolute; left: 22px; bottom: 28px; width: 130px; height: 130px;
      border-radius: 50%; background: rgba(255,255,255,.25);
      border: 2px solid rgba(255,255,255,.5); pointer-events: auto; touch-action: none;
    }
    #joyKnob {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
      margin: -29px 0 0 -29px; border-radius: 50%;
      background: rgba(255,255,255,.85); box-shadow: 0 3px 10px rgba(0,0,0,.2);
      pointer-events: none;
    }
    .btn {
      position: absolute; pointer-events: auto; touch-action: none; user-select: none;
      width: 84px; height: 84px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 700; font-size: 15px;
      font-family: ui-rounded, system-ui, sans-serif; color: #1b3a45;
      background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.7);
      backdrop-filter: blur(4px);
    }
    .btn:active, .btn.active { background: rgba(120,200,227,.85); }
    #btnJump { right: 26px; bottom: 34px; }
    #btnRun  { right: 120px; bottom: 90px; width: 72px; height: 72px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="status">v6 · karakter modeli yükleniyor…</div>
  <div id="paper"></div>
  <div id="vignette"></div>

  <div id="hud">
    <b>Ghibli Dünyası</b><br />
    <span class="desktop"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hareket ·
    <kbd>Shift</kbd> koş · <kbd>Space</kbd> zıpla<br />
    Fareyi sürükle: kamera · Tekerlek: yakınlaş</span>
    <span class="mobile">Joystick ile yürü · sağdaki butonlar koş/zıpla<br />
    Boş alanı sürükle: kamera · İki parmak: yakınlaş</span>
  </div>

  <div id="loader"><div class="t">Dünya yükleniyor…</div></div>

  <!-- Mobil dokunmatik arayüz -->
  <div id="touch">
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="btnRun" class="btn">KOŞ</div>
    <div id="btnJump" class="btn">ZIPLA</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
